<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tidepool</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Tidepool</h1>
      <div class="actions">
        <input id="search" type="search" placeholder="Filter cards…" aria-label="Filter cards" />
        <button id="reset" type="button" class="ghost">Reset board</button>
      </div>
    </header>

    <div id="banner" class="banner" hidden></div>

    <main id="board" class="board" aria-busy="true"></main>

    <footer class="footer">
      <span id="card-count"></span>
      <span class="version">v1.4.0</span>
    </footer>

    <script src="/app.js"></script>
  </body>
</html>
